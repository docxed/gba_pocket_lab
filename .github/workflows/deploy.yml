name: Deploy Poké Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: dist
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          : "${ARTIFACT_ID:?The upload step did not return a Pages artifact ID}"
          for attempt in {1..10}; do
            sleep 3
            if artifact_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id') &&
              grep -Fxq -- "$ARTIFACT_ID" <<< "$artifact_ids"; then
              echo "Pages artifact $ARTIFACT_ID is available."
              exit 0
            fi
            echo "Waiting for Pages artifact $ARTIFACT_ID (attempt $attempt/10)."
          done
          echo "::error::The uploaded artifact did not appear in this run's artifact list."
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
